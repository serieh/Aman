<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Settings – Aman</title>
</head>
<body>
  <a href="/dashboard/">← Back to chats</a>
  <h2>Settings</h2>

  <input id="name"      placeholder="Name" />
  <input id="birthdate" placeholder="Birthdate" type="date" />
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <input id="country" placeholder="Country code (e.g. SA)" />

  <button onclick="loadProfile()">Load</button>
  <button onclick="saveProfile()">Save</button>
  <button onclick="deleteAccount()">Delete Account</button>

  <script>
    const access = localStorage.getItem("access")
    if (!access) { window.location.href = "/login/" }

    async function loadProfile() {
      const res  = await fetch("/api/v1/users/me/", {
        headers: { "Authorization": `Bearer ${access}` }
      })
      if (res.status === 401) { localStorage.clear(); window.location.href = "/login/"; return }
      const data = await res.json()
      document.getElementById("name").value      = data.name      || ""
      document.getElementById("birthdate").value = data.birthdate || ""
      document.getElementById("gender").value    = data.gender    || "male"
      document.getElementById("country").value   = data.country   || ""
    }

    async function saveProfile() {
      const res = await fetch("/api/v1/users/me/", {
        method:  "PUT",
        headers: {
          "Authorization":  `Bearer ${access}`,
          "Content-Type":   "application/json"
        },
        body: JSON.stringify({
          name:      document.getElementById("name").value,
          birthdate: document.getElementById("birthdate").value,
          gender:    document.getElementById("gender").value,
          country:   document.getElementById("country").value,
        })
      })
      if (res.ok) alert("Saved!")
    }

    async function deleteAccount() {
      if (!confirm("Are you sure?")) return
      await fetch("/api/v1/users/me/", {
        method:  "DELETE",
        headers: { "Authorization": `Bearer ${access}` }
      })
      localStorage.clear()
      window.location.href = "/login/"
    }

    loadProfile()  // load profile when page opens
  </script>
</body>
</html>
