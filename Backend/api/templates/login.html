<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auth – Aman</title>
  <style>
    .hidden { display: none; }
  </style>
</head>
<body>
  
  <div id="login-section">
    <h2>Login</h2>
    <input id="login-email"    placeholder="Email" />
    <input id="login-password" placeholder="Password" type="password" />
    <button onclick="login()">Login</button>
    <p>Don't have an account? <button onclick="toggleAuth('register')">Register</button></p>
  </div>

  <div id="register-section" class="hidden">
    <h2>Register</h2>
    <input id="reg-name"      placeholder="Full Name" />
    <input id="reg-email"     placeholder="Email" type="email" />
    <input id="reg-password"  placeholder="Password" type="password" />
    <input id="reg-birthdate" placeholder="Birthdate" type="date" />
    <select id="reg-gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
    <input id="reg-country"   placeholder="Country code (e.g. SA)" maxlength="2" />
    <button onclick="register()">Register</button>
    <p>Already have an account? <button onclick="toggleAuth('login')">Login</button></p>
  </div>

  <script>
    function toggleAuth(view) {
      if (view === 'login') {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('register-section').classList.add('hidden');
      } else {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('register-section').classList.remove('hidden');
      }
    }

    async function login() {
      const res = await fetch("/api/v1/auth/login/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email:    document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        })
      })
      const data = await res.json()
      if (res.ok) {
        localStorage.setItem("access",  data.access)
        localStorage.setItem("refresh", data.refresh)
        window.location.href = "/dashboard/"  // redirect after login
      } else {
        alert("Invalid credentials")
      }
    }

    async function register() {
      const res = await fetch("/api/v1/auth/register/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name:      document.getElementById("reg-name").value,
          email:     document.getElementById("reg-email").value,
          password:  document.getElementById("reg-password").value,
          birthdate: document.getElementById("reg-birthdate").value,
          gender:    document.getElementById("reg-gender").value,
          country:   document.getElementById("reg-country").value,
        })
      })
      const data = await res.json()
      if (res.ok) {
        localStorage.setItem("access",  data.access)
        localStorage.setItem("refresh", data.refresh)
        window.location.href = "/dashboard/"  // redirect after registration
      } else {
        const errors = Object.values(data).flat().join("\n")
        alert("Registration failed:\n" + errors)
      }
    }
  </script>
</body>
</html>
